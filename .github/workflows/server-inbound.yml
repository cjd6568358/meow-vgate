# meow-vgate fork-only workflow.
#
# Upstream test.yml only triggers on pushes to `main`, so a job added there
# never runs on the `server-inbound` branch. This dedicated workflow keeps the
# fork's server-inbound delta on its own trigger and out of upstream files.
name: Server inbound

on:
  push:
    branches: [server-inbound]
    paths: ["crates/**", "server/**", "tests/**", "Cargo.toml", "Cargo.lock", ".github/workflows/server-inbound.yml"]
  pull_request:
    branches: [server-inbound]
    paths: ["crates/**", "server/**", "tests/**", "Cargo.toml", "Cargo.lock", ".github/workflows/server-inbound.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  config-hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: C-01/C-02 config listener tests
        run: cargo test -p meow-config --features server-inbound --test server_inbound_listener_test

      - name: Clippy (server-inbound)
        run: cargo clippy -p meow-config --features server-inbound --all-targets -- -D warnings

  app-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Install ARM targets
        run: |
          rustup target add aarch64-unknown-linux-musl
          rustup target add armv7-unknown-linux-gnueabihf

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Server crate checks
        working-directory: server
        run: |
          cargo fmt -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test --all-targets
          RUSTDOCFLAGS="-D warnings" cargo doc --no-deps

      - name: Server ARM target type-check (ADR 0001 Migration 2)
        working-directory: server
        run: |
          # Pure-Rust deps only — no C cross toolchain needed. Linking and
          # real size measurement happen in the release build matrix.
          cargo check --target aarch64-unknown-linux-musl
          cargo check --target armv7-unknown-linux-gnueabihf

      - name: C-03 single-process build
        run: cargo clippy -p meow-app --features server-inbound --all-targets -- -D warnings

      - name: Compile test (never run cross binaries)
        run: cargo check -p meow-app --features server-inbound --tests

  e2e-vmess-mkcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: VMess inbound tests (header/body framing)
        run: cargo test -p meow-app --features server-inbound --bin meow vmess_inbound::tests -- --nocapture

      - name: Build meow with server inbounds
        run: cargo build -p meow-app --features server-inbound

      - name: Download mihomo v1.19.34 (phone-side core)
        run: |
          curl -fsSL -o /tmp/mihomo.gz \
            https://github.com/MetaCubeX/mihomo/releases/download/v1.19.34/mihomo-linux-amd64-v1.19.34.gz
          gunzip -f /tmp/mihomo.gz
          chmod +x /tmp/mihomo
          /tmp/mihomo -v

      - name: Run VMess/mKCP end-to-end
        run: bash tests/e2e/vmess_mkcp_e2e.sh

      # 19001 VLESS/WS uses the standalone server bin (smoke relay), a
      # different path from the meow-app server-inbound build above.
      - name: Build VLESS/WS server bin
        working-directory: server
        run: cargo build --bin meow-server

      - name: Run VLESS/WS end-to-end
        env:
          MEOW_SERVER_BIN: ${{ github.workspace }}/server/target/debug/meow-server
        run: bash tests/e2e/vless_ws_e2e.sh

      # ADR 0002 core goal: one meow process, one config.yaml, BOTH inbounds
      # sharing one Arc<Tunnel> — the actual drop-in replacement path.
      - name: Run single-process dual-inbound end-to-end
        run: bash tests/e2e/single_process_e2e.sh

  # The server-inbound fork adds sha3 (VMess Chunk Masking) to meow-proxy,
  # which the client also links. test.yml's size job only runs on main/PRs,
  # so this branch would otherwise never verify the client's 8 MiB hard cap.
  client-size:
    runs-on: ubuntu-latest
    env:
      TARGET: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v5

      - name: Read pinned toolchain channel
        id: tc
        run: |
          tc=$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml | head -n1)
          if [ -z "$tc" ]; then
            echo "::error::could not parse channel from rust-toolchain.toml"
            exit 1
          fi
          echo "channel=$tc" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.tc.outputs.channel }}
          targets: ${{ env.TARGET }}

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: size-${{ env.TARGET }}-zigbuild-0.23.2

      - uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - run: cargo install --locked cargo-zigbuild --version 0.23.2

      - name: Build client minimal release binary
        run: |
          cargo zigbuild --release --locked \
            --no-default-features --features minimal \
            --target "$TARGET" \
            --bin meow

      - name: Client minimal binary size check (8 MiB hard cap)
        run: |
          read -r cap soft < <(awk -v t="$TARGET" '
            $1 == "-" && $2 == "target:" { f = ($3 == t); next }
            f && $1 == "minimal_budget_bytes:" { cap = $2 }
            f && $1 == "minimal_soft_gate:" { soft = $2 }
            END { print cap, soft }
          ' .github/workflows/build.yml)
          case "$cap" in
            "" | 0 | *[!0-9]*) echo "::error::no cap for $TARGET"; exit 1 ;;
          esac
          size=$(stat -c%s "target/$TARGET/release/meow")
          echo "$TARGET minimal: $size bytes, cap $cap bytes, headroom $((cap - size)) bytes" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt "$cap" ]; then
            if [ "$soft" = "true" ]; then
              echo "::warning::$TARGET minimal binary $size bytes exceeds soft budget $cap bytes"
            else
              echo "::error::$TARGET minimal binary $size bytes exceeds hard budget by $((size - cap)) bytes"
              exit 1
            fi
          fi

      # Fair baseline: SAME default `full` bundle + profile + toolchain,
      # WITHOUT server-inbound. The delta against the next step is the real
      # cost of the fork's server code (minimal bundle is a different feature
      # set and must not be compared against it).
      - name: Build full baseline (no server-inbound)
        env:
          CARGO_TARGET_DIR: target/fullbase
        run: |
          cargo zigbuild --release --locked \
            --target "$TARGET" \
            --bin meow

      - name: Report full baseline size
        run: |
          size=$(stat -c%s "target/fullbase/$TARGET/release/meow")
          echo "aarch64-musl full baseline: $size bytes" | tee -a "$GITHUB_STEP_SUMMARY"

      # First real aarch64-musl measurement of the single-process drop-in
      # binary (ADR 0001 Migration 3). Informational only — no hard cap is
      # set until the device owner signs off on the number.
      - name: Build single-process aarch64-musl binary (server-inbound)
        env:
          CARGO_TARGET_DIR: target/device
        run: |
          cargo zigbuild --release --locked \
            --features server-inbound \
            --target "$TARGET" \
            --bin meow

      - name: Report single-process binary size + server delta
        run: |
          BIN="target/device/$TARGET/release/meow"
          file "$BIN" | tee -a "$GITHUB_STEP_SUMMARY"
          file "$BIN" | grep -q 'statically linked' || {
            echo "::error::aarch64 binary is not statically linked"; exit 1;
          }
          base=$(stat -c%s "target/fullbase/$TARGET/release/meow")
          dev=$(stat -c%s "$BIN")
          delta=$((dev - base))
          echo "aarch64-musl full baseline:     $base bytes" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "aarch64-musl server-inbound:    $dev bytes" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "server-inbound delta (fair):    $delta bytes" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::notice::device binary $dev bytes; fair server delta $delta bytes over full baseline $base"

          # Hard cap signed off by the device owner (ADR 0001 §4): 14 MiB.
          # Independent of the client's 8 MiB cap (different feature set);
          # not additive. Measured 13,086,672 B leaves ~1.5 MiB headroom.
          CAP=14680064
          if [ "$dev" -gt "$CAP" ]; then
            echo "::error::aarch64 single-process binary $dev bytes exceeds hard cap $CAP bytes by $((dev - CAP)) bytes (ADR 0001)"
            exit 1
          fi
          echo "aarch64 single-process cap:     $CAP bytes, headroom $((CAP - dev)) bytes" | tee -a "$GITHUB_STEP_SUMMARY"


  # Manual-only: measure how much BoringSSL costs on armv7hf, static vs
  # shared .so. This is a SIZE experiment for the C-plan decision, not a
  # runnable dynamic binary — boring-sys hardcodes static link, so shipping
  # a .so requires a separate patch. Runs in the same armv7 toolchain
  # container as armv7-static (cmake + arm gcc + strip all present).
  measure-boringssl-shared:
    # Runs on every server-inbound push and on demand. Two full BoringSSL
    # builds cost a few minutes; server-inbound pushes are infrequent, and
    # `github.event.head_commit.modified` is unreliable on multi-commit
    # pushes (left this job skipped on its first run), so no path-based if.
    runs-on: ubuntu-latest
    env:
      TOOLCHAIN_IMAGE: ghcr.io/rust-cross/rust-musl-cross:armv7-musleabihf-amd64@sha256:c2603200841eac1a6681d7beef44816c9954b0f59952ae7ae96652788287e16f
    steps:
      - uses: actions/checkout@v5

      - name: Fetch crates to get vendored BoringSSL source
        run: |
          cargo fetch --locked
          BSSL_SRC=$(find "$HOME/.cargo/registry/src" -type d \
            -path '*/boring-sys-5.2.0/deps/boringssl' | head -1)
          echo "BSSL_SRC=$BSSL_SRC"
          [ -n "$BSSL_SRC" ] || { echo "::error::boring-sys source not fetched"; exit 1; }
          echo "BSSL_SRC=$BSSL_SRC" >> "$GITHUB_ENV"

      - name: Build static + shared BoringSSL and report stripped sizes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .temp
          : > .temp/bssl-ab-summary.md
          docker run --rm \
            -e GITHUB_STEP_SUMMARY=/src/.temp/bssl-ab-summary.md \
            -e BSSL_SRC="/src/vendor-boringssl" \
            -v "$PWD:/src" -v "$BSSL_SRC:/src/vendor-boringssl:ro" -w /src \
            "$TOOLCHAIN_IMAGE" bash scripts/measure-boringssl-shared.sh
          cat .temp/bssl-ab-summary.md >> "$GITHUB_STEP_SUMMARY"

  # armv7hf STATIC artifact (32-bit ARM hard-float, musl). Not the glibc
  # gnueabihf target (dynamically linked, needs GLIBC_2.28). Uses upstream's
  # container toolchain because boring-sys hits a time64-vs-libc clash on
  # 32-bit musl that the script bridges. The script ends with a hard
  # `file | grep statically linked` guard — a dynamic binary fails the job.
  armv7-static:
    runs-on: ubuntu-latest
    env:
      TARGET: armv7-unknown-linux-musleabihf
      TOOLCHAIN_IMAGE: ghcr.io/rust-cross/rust-musl-cross:armv7-musleabihf-amd64@sha256:c2603200841eac1a6681d7beef44816c9954b0f59952ae7ae96652788287e16f
    steps:
      - uses: actions/checkout@v5

      - name: Build armv7hf static single-process binary in toolchain container
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -e MEOW_EXTRA_CARGO_ARGS="--features server-inbound" \
            -v "$PWD:/src" -w /src \
            "$TOOLCHAIN_IMAGE" bash scripts/build-armv7-musl.sh

      - name: Verify static linkage and report size
        run: |
          BIN="target/$TARGET/release/meow"
          file "$BIN" | tee -a "$GITHUB_STEP_SUMMARY"
          file "$BIN" | grep -q 'statically linked' || {
            echo "::error::armv7hf binary is not statically linked"; exit 1;
          }
          size=$(stat -c%s "$BIN")
          echo "armv7hf static single-process: $size bytes" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::notice::armv7hf static binary $size bytes (server-inbound, statically linked verified)"
          # Same signed-off 14 MiB hard cap as aarch64 (ADR 0001 §4).
          CAP=14680064
          if [ "$size" -gt "$CAP" ]; then
            echo "::error::armv7hf binary $size bytes exceeds hard cap $CAP bytes by $((size - CAP)) bytes (ADR 0001)"
            exit 1
          fi
          echo "armv7hf cap: $CAP bytes, headroom $((CAP - size)) bytes" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: meow-vgate-v0.29.0-armv7hf-linux-musl
          path: target/armv7-unknown-linux-musleabihf/release/meow
          if-no-files-found: error
          retention-days: 7

  # Manual-only: build the deployable aarch64 STATIC single-process binary
  # and upload it as an artifact. Normal pushes skip this (no CI time cost).
  # Used to fetch the binary for on-device temporary testing.
  publish-aarch64:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      TARGET: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v5

      - name: Read pinned toolchain channel
        id: tc
        run: |
          tc=$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml | head -n1)
          echo "channel=$tc" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.tc.outputs.channel }}
          targets: ${{ env.TARGET }}

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: size-${{ env.TARGET }}-zigbuild-0.23.2

      - uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
      - run: cargo install --locked cargo-zigbuild --version 0.23.2

      - name: Build aarch64 static single-process binary
        env:
          CARGO_TARGET_DIR: target/device
        run: |
          cargo zigbuild --release --locked \
            --features server-inbound \
            --target "$TARGET" --bin meow
          file "target/device/$TARGET/release/meow" | grep -q 'statically linked'

      - uses: actions/upload-artifact@v4
        with:
          name: meow-vgate-v0.29.0-aarch64-linux-musl
          path: target/device/aarch64-unknown-linux-musl/release/meow
          if-no-files-found: error
          retention-days: 7
