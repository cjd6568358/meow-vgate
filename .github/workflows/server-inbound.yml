# meow-vgate fork-only workflow.
#
# Upstream test.yml only triggers on pushes to `main`, so a job added there
# never runs on the `server-inbound` branch. This dedicated workflow keeps the
# fork's server-inbound delta on its own trigger and out of upstream files.
name: Server inbound

on:
  push:
    branches: [server-inbound]
    paths: ["crates/**", "server/**", "tests/**", "Cargo.toml", "Cargo.lock", ".github/workflows/server-inbound.yml"]
  pull_request:
    branches: [server-inbound]
    paths: ["crates/**", "server/**", "tests/**", "Cargo.toml", "Cargo.lock", ".github/workflows/server-inbound.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  config-hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: C-01/C-02 config listener tests
        run: cargo test -p meow-config --features server-inbound --test server_inbound_listener_test

      - name: Clippy (server-inbound)
        run: cargo clippy -p meow-config --features server-inbound --all-targets -- -D warnings

  app-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl,armv7-unknown-linux-gnueabihf

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Server crate checks
        working-directory: server
        run: |
          cargo fmt -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test --all-targets
          RUSTDOCFLAGS="-D warnings" cargo doc --no-deps

      - name: Server ARM target type-check (ADR 0001 Migration 2)
        working-directory: server
        run: |
          # Pure-Rust deps only — no C cross toolchain needed. Linking and
          # real size measurement happen in the release build matrix.
          cargo check --target aarch64-unknown-linux-musl
          cargo check --target armv7-unknown-linux-gnueabihf

      - name: C-03 single-process build
        run: cargo clippy -p meow-app --features server-inbound --all-targets -- -D warnings

      - name: Compile test (never run cross binaries)
        run: cargo check -p meow-app --features server-inbound --tests

  e2e-vmess-mkcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: VMess inbound tests (header/body framing)
        run: cargo test -p meow-app --features server-inbound --bin meow vmess_inbound::tests -- --nocapture

      - name: Build meow with server inbounds
        run: cargo build -p meow-app --features server-inbound

      - name: Download mihomo v1.19.34 (phone-side core)
        run: |
          curl -fsSL -o /tmp/mihomo.gz \
            https://github.com/MetaCubeX/mihomo/releases/download/v1.19.34/mihomo-linux-amd64-v1.19.34.gz
          gunzip -f /tmp/mihomo.gz
          chmod +x /tmp/mihomo
          /tmp/mihomo -v

      - name: Run VMess/mKCP end-to-end
        run: bash tests/e2e/vmess_mkcp_e2e.sh

  # The server-inbound fork adds sha3 (VMess Chunk Masking) to meow-proxy,
  # which the client also links. test.yml's size job only runs on main/PRs,
  # so this branch would otherwise never verify the client's 8 MiB hard cap.
  client-size:
    runs-on: ubuntu-latest
    env:
      TARGET: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v5

      - name: Read pinned toolchain channel
        id: tc
        run: |
          tc=$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml | head -n1)
          if [ -z "$tc" ]; then
            echo "::error::could not parse channel from rust-toolchain.toml"
            exit 1
          fi
          echo "channel=$tc" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.tc.outputs.channel }}
          targets: ${{ env.TARGET }}

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: size-${{ env.TARGET }}-zigbuild-0.23.2

      - uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - run: cargo install --locked cargo-zigbuild --version 0.23.2

      - name: Build client minimal release binary
        run: |
          cargo zigbuild --release --locked \
            --no-default-features --features minimal \
            --target "$TARGET" \
            --bin meow

      - name: Client minimal binary size check (8 MiB hard cap)
        run: |
          read -r cap soft < <(awk -v t="$TARGET" '
            $1 == "-" && $2 == "target:" { f = ($3 == t); next }
            f && $1 == "minimal_budget_bytes:" { cap = $2 }
            f && $1 == "minimal_soft_gate:" { soft = $2 }
            END { print cap, soft }
          ' .github/workflows/build.yml)
          case "$cap" in
            "" | 0 | *[!0-9]*) echo "::error::no cap for $TARGET"; exit 1 ;;
          esac
          size=$(stat -c%s "target/$TARGET/release/meow")
          echo "$TARGET minimal: $size bytes, cap $cap bytes, headroom $((cap - size)) bytes" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt "$cap" ]; then
            if [ "$soft" = "true" ]; then
              echo "::warning::$TARGET minimal binary $size bytes exceeds soft budget $cap bytes"
            else
              echo "::error::$TARGET minimal binary $size bytes exceeds hard budget by $((size - cap)) bytes"
              exit 1
            fi
          fi
